<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root {
  --void: #060a0f;
  --panel: #0c131b;
  --line: #1e2b38;
  --ink: #dfe9f1;
  --dim: #7d91a2;
  --ice: #86d6ff;
  --f-display: "Chakra Petch", "Arial Narrow", Arial, sans-serif;
  --f-body: Barlow, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); }
body {
  margin: 0;
  min-height: 100%;
  padding: 48px 16px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(134, 214, 255, .12), transparent 55%),
    var(--void);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.5;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 32px;
  background: var(--panel);
  border: 1px solid var(--line);
}
p {
  margin: 0;
  font-family: var(--f-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--dim);
}
h1 {
  margin: 8px 0 20px;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 40px;
  line-height: 1;
  letter-spacing: .02em;
  text-transform: uppercase;
}
ul { margin: 0; padding: 0; list-style: none; }
a {
  color: var(--ice);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 22px;
  text-decoration: none;
}
a:hover, a:focus { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <p>Sheets</p>
  <h1>Character sheets</h1>
  <ul>
    <li><a href="/sheets/man-in-the-low-berth/">The Man in the Low Berth</a></li>
  </ul>
</main>
</body>
</html>
