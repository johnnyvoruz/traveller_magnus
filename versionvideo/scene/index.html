<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release Video Scene</title>
  <link rel="icon" href="/assets/mark.svg">
  <link rel="stylesheet" href="/scene/scene.css">
  <script src="/gsap/gsap.min.js"></script>
</head>
<body>
  <div id="stage" class="stage"></div>
  <div id="transport" class="transport" hidden>
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
    <output id="clock">0.00 s</output>
  </div>
  <script type="module" src="/scene/scene.js"></script>
</body>
</html>
